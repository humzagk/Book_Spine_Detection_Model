name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests cover the geometry and preprocessing helpers, which only need OpenCV + NumPy
      - run: pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -v
